services:
  db:
    image: postgres:15
    container_name: royalty-db
    environment:
      POSTGRES_DB: royalty_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: royalty-api
    ports:
      - "8080:8080"
    environment:
      # Spring Boot overrides to connect to the Docker network instead of localhost
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/royalty_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db

volumes:
  postgres_data: